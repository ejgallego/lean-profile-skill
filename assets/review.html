<!doctype html>
<!-- AI-generated reusable technical performance report. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{TITLE}}</title>
    <link rel="stylesheet" href="review.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>{{TITLE}}</h1>
        {{SUMMARY}}
        <nav aria-label="Report contents">{{NAVIGATION}}</nav>
      </header>
      {{SECTIONS}}
    </main>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <script src="review.js"></script>
  </body>
</html>
